<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Índice CNN Fear &amp; Greed</title>
  <style>
    body {
      font: 16px system-ui, sans-serif;
      margin: 40px;
      text-align: center;
    }

    .gauge {
      width: min(360px, 100%);
      margin: 24px auto 0;
    }

    .gauge svg {
      display: block;
      width: 100%;
    }

    #value {
      font-size: 4rem;
      margin: -4px 0 0;
    }

    #error {
      color: #b00020;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
    }

    dialog {
      max-width: 420px;
      text-align: left;
    }

    #explanation {
      width: min(900px, 90vw);
      max-width: none;
      box-sizing: border-box;
    }

    #explanation img {
      display: block;
      max-width: 100%;
      max-height: 75vh;
      margin: 0 auto 16px;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <h1>Indicador de codicia y miedo de CNN</h1>
  <div class="gauge">
    <svg id="gauge" viewBox="0 0 300 170" role="img" aria-label="Indicador cargando">
      <g id="segments" fill="none" stroke-width="20" stroke-linecap="round">
        <path d="M 30 150 A 120 120 0 0 1 65 65" stroke="#de4f4f" />
        <path d="M 65 65 A 120 120 0 0 1 129 32" stroke="#e78f4d" />
        <path d="M 129 32 A 120 120 0 0 1 171 32" stroke="#ead25c" />
        <path d="M 171 32 A 120 120 0 0 1 235 65" stroke="#8dc051" />
        <path d="M 235 65 A 120 120 0 0 1 270 150" stroke="#3b9e6b" />
      </g>
      <g fill="#333" font-size="12" text-anchor="middle">
        <text x="14" y="154">0</text>
        <text x="54" y="58">25</text>
        <text x="150" y="17">50</text>
        <text x="246" y="58">75</text>
        <text x="286" y="154">100</text>
      </g>
      <g id="needle">
        <line x1="150" y1="150" x2="150" y2="53" stroke="#222" stroke-width="4" />
        <circle cx="150" cy="150" r="7" fill="#222" />
      </g>
    </svg>
  </div>
  <div id="value">Cargando…</div>
  <div id="rating"></div>
  <p id="status"></p>
  <p id="error" role="alert"></p>
  <div class="actions">
    <button id="explanationButton" type="button">Explicación</button>
    <button id="sourceButton" type="button">Fuente</button>
  </div>
  <dialog id="explanation" aria-labelledby="explanationTitle">
    <h2 id="explanationTitle">Indicador de miedo y codicia</h2>
    <img src="../img/cnn-fear-and-greed-explicacion.png" alt="Infografía explicativa del índice CNN Fear &amp; Greed">
    <button id="closeExplanation" type="button">Cerrar</button>
  </dialog>
  <dialog id="source" aria-labelledby="sourceTitle">
    <h2 id="sourceTitle">Fuente</h2>
    <p><a href="https://edition.cnn.com/markets/fear-and-greed" target="_blank"
        rel="noopener noreferrer">https://edition.cnn.com/markets/fear-and-greed</a></p>
    <button id="closeSource" type="button">Cerrar</button>
  </dialog>

  <script>
    const API_URL = "https://production.dataviz.cnn.io/index/fearandgreed/graphdata";
    const CNN_PAGE_URL = "https://edition.cnn.com/markets/fear-and-greed";
    const CORS_PROXY = "https://bold-moon-d548.subdominio.workers.dev/?url=";
    const labels = {
      "extreme fear": "Miedo extremo",
      "fear": "Miedo",
      "neutral": "Neutral",
      "greed": "Codicia",
      "extreme greed": "Codicia extrema"
    };

    document.getElementById("explanationButton").addEventListener("click", () => {
      document.getElementById("explanation").showModal();
    });
    document.getElementById("closeExplanation").addEventListener("click", () => {
      document.getElementById("explanation").close();
    });
    document.getElementById("sourceButton").addEventListener("click", () => {
      const sourceWindow = window.open(CNN_PAGE_URL, "_blank");
      if (sourceWindow) {
        sourceWindow.opener = null;
      } else {
        document.getElementById("source").showModal();
      }
    });
    document.getElementById("closeSource").addEventListener("click", () => {
      document.getElementById("source").close();
    });

    function drawGauge(score) {
      score = Math.max(0, Math.min(100, score));

      const bounds = [0, 25, 45, 55, 75, 100];
      const colors = ["#e64b4b", "#f08a4b", "#edc84b", "#8dbd4a", "#35a66f"];

      const point = angle => {
        const radians = angle * Math.PI / 180;
        return [150 + 115 * Math.cos(radians), 150 - 115 * Math.sin(radians)];
      };

      const arcs = colors.map((color, i) => {
        const start = point(180 - bounds[i] * 1.8 - 2.5);
        const end = point(180 - bounds[i + 1] * 1.8 + 2.5);

        return `<path d="M ${start[0]} ${start[1]} A 115 115 0 0 1 ${end[0]} ${end[1]}" stroke="${color}" fill="none" />`;
      });

      document.getElementById("segments").innerHTML = arcs.join("");

      document.getElementById("needle").setAttribute("transform", `rotate(${-90 + score * 1.8} 150 150)`);
      document.getElementById("gauge").setAttribute("aria-label", `Valor del indicador: ${Math.round(score)} de 100`);
    }

    async function readIndex(url) {
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) throw new Error("HTTP " + response.status);
      return response.json();
    }

    async function update() {
      const value = document.getElementById("value");
      const status = document.getElementById("status");
      const error = document.getElementById("error");
      error.textContent = "";
      status.textContent = "Consultando CNN…";

      try {
        let data;
        try {
          data = await readIndex(API_URL);
        } catch (directError) {
          try {
            data = await readIndex(CORS_PROXY + encodeURIComponent(API_URL));
          } catch (proxyError) {
            throw new Error("Acceso directo: " + directError.message + "; proxy: " + proxyError.message);
          }
        }

        const index = data && data.fear_and_greed;
        if (!index || !Number.isFinite(index.score) || !index.rating) {
          throw new Error("La respuesta de CNN no contiene el indicador esperado.");
        }

        value.textContent = Math.round(index.score);
        drawGauge(index.score);
        document.getElementById("rating").textContent = labels[index.rating] || index.rating;
        status.textContent = "Actualizado: " + new Date(index.timestamp).toLocaleString("es-ES");
      } catch (err) {
        status.textContent = "";
        error.textContent = "No se pudo obtener el dato: " + err.message;
      }
    }

    update();
  </script>
</body>

</html>
